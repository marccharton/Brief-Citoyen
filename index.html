<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief citoyen</title>
  <meta name="description" content="Un sujet de politique française chaque matin, expliqué depuis les bases.">
  <style>
    :root{--bg:#F3F5F7;--ink:#1B2430;--soft:#55606D;--accent:#2E5C8A}
    @media (prefers-color-scheme: dark){:root{--bg:#12171D;--ink:#E4E9EF;--soft:#A6B0BC;--accent:#86B2DE;color-scheme:dark}}
    body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,serif}
    main{max-width:640px;margin:0 auto;padding:72px 20px}
    p.e{font:700 12px system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0}
    h1{font-size:40px;margin:6px 0 10px}
    p{color:var(--soft)}
  </style>
</head>
<body>
  <main>
    <p class="e">Bientôt</p>
    <h1>Brief citoyen</h1>
    <p>Un sujet de politique française chaque matin de semaine, expliqué depuis les bases, avec les arguments des deux côtés et des sources pour creuser.</p>
  </main>
</body>
</html>
